services:
  service-discovery:
    build: .
    container_name: adaptive-service-discovery
    restart: unless-stopped
    ports:
      - "15000:15000"
    volumes:
      - ./logs:/app/logs
      - ../../../data/dynamic_content:/app/dynamic_content:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
