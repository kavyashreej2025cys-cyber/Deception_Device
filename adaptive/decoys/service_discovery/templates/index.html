<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NovaTech Service Gateway</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #10254a; }
      main { width: min(920px, calc(100% - 40px)); margin: 64px auto; }
      header, section { background: white; border: 1px solid #dce5f2; border-radius: 16px; padding: 28px; box-shadow: 0 12px 36px #163c7012; }
      header { margin-bottom: 20px; }
      h1 { margin: 4px 0 8px; }
      .eyebrow { color: #2874d5; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 22px; }
      .card { border: 1px solid #dce5f2; border-radius: 12px; padding: 18px; }
      .status { color: #14835d; font-weight: 700; }
      form { display: grid; gap: 12px; max-width: 420px; }
      input, button { padding: 12px; border-radius: 8px; border: 1px solid #bac9dd; font: inherit; }
      button { background: #246ed3; color: white; border: 0; font-weight: 700; }
      .error { color: #b4233f; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">NovaTech Infrastructure</div>
        <h1>Service Gateway</h1>
        <p>Administration and operational service directory.</p>
        <div class="grid">
          <div class="card"><strong>Identity API</strong><p class="status">Operational</p></div>
          <div class="card"><strong>Finance API</strong><p class="status">Operational</p></div>
          <div class="card"><strong>Camera Gateway</strong><p>Maintenance required</p></div>
        </div>
      </header>
      <section>
        <h2>Administrator access</h2>
        {% if login_error %}<p class="error">{{ login_error }}</p>{% endif %}
        <form method="post" action="/login">
          <input name="username" placeholder="Username" autocomplete="off">
          <input name="password" type="password" placeholder="Password" autocomplete="off">
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
