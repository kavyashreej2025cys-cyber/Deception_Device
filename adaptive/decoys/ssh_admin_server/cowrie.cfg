[honeypot]
hostname = core-admin-01
log_path = var/log/cowrie
backend = shell
interactive_timeout = 300

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
sftp_enabled = true
forwarding = false
auth_publickey_allow_any = false
auth_keyboard_interactive_enabled = true

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
